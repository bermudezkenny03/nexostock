<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NexoStock: gestión de inventario, productos y ventas." />
    <title>NexoStock</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nexostock.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('app-dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div role="status" aria-live="polite" style="display:grid;place-items:center;min-height:100vh;font-family:system-ui,sans-serif;color:#64748b">
        Cargando NexoStock…
      </div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
