<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NexoStock: gestión de inventario, productos y ventas." />
    <title>NexoStock</title>
    <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('nexostock.layout') || 'null');
          var dark = stored && typeof stored.darkTheme === 'boolean'
            ? stored.darkTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('app-dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="preloader" role="status" aria-live="polite">
        <div class="preloader-content"></div>
      </div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
