services:
  postgres:
    image: postgres:16-alpine
    container_name: nexostock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexostock
      POSTGRES_PASSWORD: nexostock
      POSTGRES_DB: nexostock
    ports:
      - "5432:5432"
    volumes:
      - nexostock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexostock -d nexostock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://nexostock:nexostock@postgres:5432/nexostock?schema=auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - "3001:3001"

volumes:
  nexostock-postgres-data:
