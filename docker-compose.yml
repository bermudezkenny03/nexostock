services:
  postgres:
    image: postgres:16-alpine
    container_name: nexostock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexostock
      POSTGRES_PASSWORD: nexostock
      POSTGRES_DB: nexostock
    ports:
      - "5432:5432"
    volumes:
      - nexostock-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/create-databases.sh:/docker-entrypoint-initdb.d/create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexostock -d nexostock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        SERVICE: apps/auth-service
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy && if [ "$$RUN_SEED" = "true" ]; then node dist/seed.js; else node dist/bootstrap.js; fi && node dist/main.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3001"
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://nexostock:nexostock@postgres:5432/auth?schema=auth
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-nexostock-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nexostock-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      RUN_SEED: ${RUN_SEED:-true}
      CHECKPOINT_DISABLE: "1"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-internal-key}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  products-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        SERVICE: apps/products-service
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy && if [ "$$RUN_SEED" = "true" ]; then node dist/seed.js; fi && node dist/main.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3002"
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://nexostock:nexostock@postgres:5432/products?schema=products
      RUN_SEED: ${RUN_SEED:-true}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      JWT_ISSUER: ${JWT_ISSUER:-nexostock-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nexostock-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-internal-key}
      AUTH_SERVICE_URL: http://auth-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3003
    ports:
      - "3002:3002"

  inventory-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        SERVICE: apps/inventory-service
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy && if [ "$$RUN_SEED" = "true" ]; then node dist/seed.js; fi && node dist/main.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3003"
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://nexostock:nexostock@postgres:5432/inventory?schema=inventory
      RUN_SEED: ${RUN_SEED:-true}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      JWT_ISSUER: ${JWT_ISSUER:-nexostock-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nexostock-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-internal-key}
      PRODUCTS_SERVICE_URL: http://products-service:3002
    ports:
      - "3003:3003"

  sales-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        SERVICE: apps/sales-service
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy && if [ "$$RUN_SEED" = "true" ]; then node dist/seed.js; fi && node dist/main.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3004"
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://nexostock:nexostock@postgres:5432/sales?schema=sales
      RUN_SEED: ${RUN_SEED:-true}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      JWT_ISSUER: ${JWT_ISSUER:-nexostock-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nexostock-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-internal-key}
      PRODUCTS_SERVICE_URL: http://products-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
    ports:
      - "3004:3004"

  reports-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.http
      args:
        SERVICE: apps/reports-service
    restart: unless-stopped
    environment:
      PORT: "3005"
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      JWT_ISSUER: ${JWT_ISSUER:-nexostock-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nexostock-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-internal-key}
      PRODUCTS_SERVICE_URL: http://products-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      SALES_SERVICE_URL: http://sales-service:3004
    ports:
      - "3005:3005"

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.http
      args:
        SERVICE: apps/api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - products-service
      - inventory-service
      - sales-service
      - reports-service
    environment:
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      JWT_ISSUER: ${JWT_ISSUER:-nexostock-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nexostock-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-internal-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCTS_SERVICE_URL: http://products-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      SALES_SERVICE_URL: http://sales-service:3004
      REPORTS_SERVICE_URL: http://reports-service:3005
    ports:
      - "3000:3000"

volumes:
  nexostock-postgres-data:
